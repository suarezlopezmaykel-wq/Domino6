name: Completar V4 Domino6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  completar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Completar V4
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("Domino6/app/src/main/java/com/example/domino6/MainActivity.java")
          s = p.read_text()

          def replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"ERROR: no se encontro: {label}")
              s = s.replace(old, new, 1)
              print("OK:", label)

          replace(
              'ArrayList<Domino> hand=new ArrayList<>(),chain=new ArrayList<>();int turn;boolean first;int left,right,passCount,finished;',
              'ArrayList<Domino> hand=new ArrayList<>(),chain=new ArrayList<>();int turn;boolean first;int left,right,passCount,finished,winner=-1;String result="";',
              'variables winner y result del cliente'
          )

          replace(
              'void broadcast(){if(game==null)return;for(Peer p:peers)p.send(game.stateFor(p.id));}',
              'void broadcast(){if(game==null)return;for(Peer p:peers)p.send(game.stateFor(p.id));runOnUiThread(()->{if(game!=null)new HostGameView().show();});}',
              'actualizacion del anfitrion'
          )

          replace(
              'b.setOnClickListener(v->host.action(0,"PLAY|"+ix));',
              'b.setEnabled(!host.game.finished);b.setOnClickListener(v->host.action(0,"PLAY|"+ix));',
              'bloqueo de fichas al terminar'
          )

          replace(
              'Button pass=btn("Pasar");addView(pass);',
              'Button pass=btn("Pasar");pass.setEnabled(host.game==null||!host.game.finished);addView(pass);',
              'bloqueo de pasar al terminar'
          )

          replace(
              'if(host.game==null)return"Esperando jugadores…";if(host.game.finished)return"Mano terminada";return host.game.turn==0?"Tu turno":"Turno del Jugador "+(host.game.turn+1);',
              'if(host.game==null)return"Esperando jugadores…";if(host.game.finished)return host.game.result;return host.game.turn==0?"Tu turno":"Turno del Jugador "+(host.game.turn+1);',
              'resultado visible en anfitrion'
          )

          p.write_text(s)
          print("V4 completada.")
          PY

      - name: Verificar
        run: |
          git diff --check
          grep -n "winner=-1" Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "runOnUiThread" Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "host.game.result" Domino6/app/src/main/java/com/example/domino6/MainActivity.java

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          git diff --cached --quiet || git commit -m "Completar V4 de Domino6"
          git push