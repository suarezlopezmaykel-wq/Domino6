name: V5.2 Mesa Fichas Icono

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Modificar interfaz visual
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("Domino6/app/src/main/java/com/example/domino6/MainActivity.java")
          s = p.read_text()

          # Imports gráficos
          s = s.replace(
              'import android.view.*;',
              '''import android.view.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;'''
          )

          # Sustituir helpers visuales
          start = s.index('LinearLayout base()')
          end = s.index('class LocalGame', start)

          helpers = r'''
          LinearLayout base(){
              LinearLayout l=new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              l.setPadding(18,30,18,18);
              l.setGravity(Gravity.CENTER_HORIZONTAL);
              l.setBackgroundColor(Color.rgb(27,76,54));
              return l;
          }

          TextView title(String s){
              TextView v=txt(s);
              v.setTextSize(28);
              v.setGravity(Gravity.CENTER);
              v.setTextColor(Color.WHITE);
              v.setPadding(0,8,0,18);
              return v;
          }

          TextView txt(String s){
              TextView v=new TextView(this);
              v.setText(s);
              v.setTextSize(18);
              v.setTextColor(Color.WHITE);
              v.setPadding(0,8,0,8);
              return v;
          }

          Button btn(String s){
              Button b=new Button(this);
              b.setText(s);
              b.setTextSize(16);
              b.setAllCaps(false);
              b.setTextColor(Color.WHITE);

              GradientDrawable g=new GradientDrawable();
              g.setColor(Color.rgb(190,145,45));
              g.setCornerRadius(18);
              b.setBackground(g);

              LinearLayout.LayoutParams lp=
                  new LinearLayout.LayoutParams(-1,-2);
              lp.setMargins(0,6,0,6);
              b.setLayoutParams(lp);
              return b;
          }

          void toast(String s){
              runOnUiThread(()->
                  Toast.makeText(this,s,Toast.LENGTH_SHORT).show());
          }

          class DominoTile extends View {
              int top,bottom;
              Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);

              DominoTile(int a,int b){
                  super(MainActivity.this);
                  top=a;
                  bottom=b;
                  setClickable(true);
              }

              protected void onDraw(Canvas c){
                  super.onDraw(c);

                  float w=getWidth();
                  float h=getHeight();

                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.rgb(250,244,222));

                  RectF r=new RectF(3,3,w-3,h-3);
                  c.drawRoundRect(r,12,12,paint);

                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(3);
                  paint.setColor(Color.rgb(91,58,32));
                  c.drawRoundRect(r,12,12,paint);

                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(2);
                  paint.setColor(Color.rgb(150,130,100));
                  c.drawLine(9,h/2,w-9,h/2,paint);

                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.BLACK);

                  drawPips(c,top,0,w,h/2);
                  drawPips(c,bottom,h/2,w,h);
              }

              void drawPips(Canvas c,int n,float y1,float w,float y2){
                  float cx=w/2;
                  float cy=(y1+y2)/2;
                  float dx=w*0.25f;
                  float dy=(y2-y1)*0.25f;
                  float r=Math.max(4f,Math.min(w,h)*0.055f);

                  if(n==1){
                      c.drawCircle(cx,cy,r,paint);
                  }else if(n==2){
                      c.drawCircle(cx-dx,cy-dy,r,paint);
                      c.drawCircle(cx+dx,cy+dy,r,paint);
                  }else if(n==3){
                      c.drawCircle(cx-dx,cy-dy,r,paint);
                      c.drawCircle(cx,cy,r,paint);
                      c.drawCircle(cx+dx,cy+dy,r,paint);
                  }else if(n==4){
                      c.drawCircle(cx-dx,cy-dy,r,paint);
                      c.drawCircle(cx+dx,cy-dy,r,paint);
                      c.drawCircle(cx-dx,cy+dy,r,paint);
                      c.drawCircle(cx+dx,cy+dy,r,paint);
                  }else if(n==5){
                      c.drawCircle(cx-dx,cy-dy,r,paint);
                      c.drawCircle(cx+dx,cy-dy,r,paint);
                      c.drawCircle(cx,cy,r,paint);
                      c.drawCircle(cx-dx,cy+dy,r,paint);
                      c.drawCircle(cx+dx,cy+dy,r,paint);
                  }else if(n==6){
                      c.drawCircle(cx-dx,cy-dy,r,paint);
                      c.drawCircle(cx-dx,cy,r,paint);
                      c.drawCircle(cx-dx,cy+dy,r,paint);
                      c.drawCircle(cx+dx,cy-dy,r,paint);
                      c.drawCircle(cx+dx,cy,r,paint);
                      c.drawCircle(cx+dx,cy+dy,r,paint);
                  }
              }
          }

          View tile(Domino d){
              DominoTile v=new DominoTile(d.a,d.b);
              v.setLayoutParams(new LinearLayout.LayoutParams(70,120));
              return v;
          }

          void addTile(LinearLayout box,Domino d,View.OnClickListener click){
              DominoTile v=new DominoTile(d.a,d.b);
              v.setOnClickListener(click);
              box.addView(v,new LinearLayout.LayoutParams(70,120));
          }

          '''

          s=s[:start]+helpers+s[end:]

          # Cambiar LocalGame.draw()
          old_start=s.index('void draw(){',s.index('class LocalGame'))
          old_end=s.index('String chainString()',old_start)

          local_draw=r'''void draw(){
              removeAllViews();
              setBackgroundColor(Color.rgb(27,76,54));

              addView(title("DOMINÓ 6"));

              status=txt(turn==0?
                  "TU TURNO":
                  "Turno de la computadora");
              addView(status);

              addView(txt(chain.isEmpty()?
                  "Mesa":
                  "Mesa de juego"));

              HorizontalScrollView boardScroll=
                  new HorizontalScrollView(MainActivity.this);
              LinearLayout boardBox=
                  new LinearLayout(MainActivity.this);
              boardBox.setPadding(8,8,8,12);

              for(Domino d:chain){
                  boardBox.addView(
                      tile(d),
                      new LinearLayout.LayoutParams(58,100)
                  );
              }

              boardScroll.addView(boardBox);
              addView(boardScroll,
                  new LinearLayout.LayoutParams(-1,110));

              addView(txt("Tus fichas:"));

              HorizontalScrollView handScroll=
                  new HorizontalScrollView(MainActivity.this);
              handBox=new LinearLayout(MainActivity.this);
              handBox.setGravity(Gravity.CENTER);

              for(int i=0;i<hands.get(0).size();i++){
                  final int ix=i;
                  addTile(handBox,hands.get(0).get(i),
                      v->playHuman(ix));
              }

              handScroll.addView(handBox);
              addView(handScroll,
                  new LinearLayout.LayoutParams(-1,130));

              Button pass=btn("Pasar");
              addView(pass);
              pass.setOnClickListener(v->passHuman());

              Button menu=btn("Menú");
              addView(menu);
              menu.setOnClickListener(v->showMenu());

              if(turn==1)
                  new Handler().postDelayed(this::cpuMove,450);
          }

          '''

          s=s[:old_start]+local_draw+s[old_end:]

          # HostGameView.draw()
          hs=s.index('void draw(){',s.index('class HostGameView'))
          he=s.index('String gameStatus()',hs)

          host_draw=r'''void draw(){
              removeAllViews();
              setBackgroundColor(Color.rgb(27,76,54));

              addView(title("DOMINÓ 6 · Bluetooth"));
              addView(txt("Tú eres Jugador 1"));

              status=txt(gameStatus());
              addView(status);

              addView(txt("Mesa de juego"));

              HorizontalScrollView boardScroll=
                  new HorizontalScrollView(MainActivity.this);
              LinearLayout boardBox=
                  new LinearLayout(MainActivity.this);
              boardBox.setPadding(8,8,8,12);

              if(host.game!=null){
                  for(Domino d:host.game.chain){
                      boardBox.addView(
                          tile(d),
                          new LinearLayout.LayoutParams(58,100)
                      );
                  }
              }

              boardScroll.addView(boardBox);
              addView(boardScroll,
                  new LinearLayout.LayoutParams(-1,110));

              addView(txt("Tus fichas:"));

              HorizontalScrollView handScroll=
                  new HorizontalScrollView(MainActivity.this);
              handBox=new LinearLayout(MainActivity.this);

              if(host.game!=null){
                  for(int i=0;i<host.game.hands.get(0).size();i++){
                      final int ix=i;
                      addTile(handBox,
                          host.game.hands.get(0).get(i),
                          v->host.action(0,"PLAY|"+ix));
                  }
              }

              handScroll.addView(handBox);
              addView(handScroll,
                  new LinearLayout.LayoutParams(-1,130));

              Button pass=btn("Pasar");
              addView(pass);
              pass.setOnClickListener(v->host.action(0,"PASS"));

              Button menu=btn("Salir al menú");
              addView(menu);
              menu.setOnClickListener(v->{
                  host.stop();
                  showMenu();
              });
          }

          '''

          s=s[:hs]+host_draw+s[he:]

          # Client drawClient()
          cs=s.index('void drawClient()',s.index('class NetworkClient'))
          ce=s.index('void removeViewIfAny()',cs)

          client_draw=r'''void drawClient(){
              removeViewIfAny();

              LinearLayout l=base();

              l.addView(title("DOMINÓ 6 · Bluetooth"));

              l.addView(txt(
                  "Eres Jugador "+(me+1)+" de "+n
              ));

              String estado;
              if(finished){
                  estado=result;
              }else{
                  estado=(turn==me)?
                      "TU TURNO":
                      "Turno del Jugador "+(turn+1);
              }

              TextView st=txt(estado);

              if(finished){
                  st.setBackgroundColor(Color.rgb(120,35,35));
              }else{
                  st.setBackgroundColor(Color.rgb(55,100,135));
              }

              l.addView(st);

              l.addView(txt("Mesa de juego"));

              HorizontalScrollView boardScroll=
                  new HorizontalScrollView(MainActivity.this);
              LinearLayout boardBox=
                  new LinearLayout(MainActivity.this);
              boardBox.setPadding(8,8,8,12);

              for(Domino d:chain){
                  boardBox.addView(
                      tile(d),
                      new LinearLayout.LayoutParams(58,100)
                  );
              }

              boardScroll.addView(boardBox);
              l.addView(boardScroll,
                  new LinearLayout.LayoutParams(-1,110));

              l.addView(txt("Tus fichas:"));

              HorizontalScrollView handScroll=
                  new HorizontalScrollView(MainActivity.this);
              LinearLayout hb=new LinearLayout(MainActivity.this);

              for(int i=0;i<hand.size();i++){
                  final int ix=i;
                  addTile(hb,hand.get(i),v->{
                      if(turn==me && !finished)
                          send("PLAY|"+ix);
                  });
              }

              handScroll.addView(hb);
              l.addView(handScroll,
                  new LinearLayout.LayoutParams(-1,130));

              Button pass=btn("Pasar");
              l.addView(pass);
              pass.setOnClickListener(v->{
                  if(turn==me && !finished)
                      send("PASS");
              });

              Button menu=btn("Menú");
              l.addView(menu);
              menu.setOnClickListener(v->{
                  try{socket.close();}catch(Exception ignored){}
                  showMenu();
              });

              setContentView(l);
          }

          '''

          s=s[:cs]+client_draw+s[ce:]

          p.write_text(s)
          print("Interfaz V5.2 aplicada.")

          PY

      - name: Crear icono
        run: |
          mkdir -p Domino6/app/src/main/res/drawable

          cat > Domino6/app/src/main/res/drawable/ic_domino6.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#1B4C36"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <path
                  android:fillColor="#FAF4DE"
                  android:pathData="M27,8 L81,8 Q88,8 88,15 L88,93 Q88,100 81,100 L27,100 Q20,100 20,93 L20,15 Q20,8 27,8 Z"/>

              <path
                  android:strokeColor="#5B3A20"
                  android:strokeWidth="4"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M27,8 L81,8 Q88,8 88,15 L88,93 Q88,100 81,100 L27,100 Q20,100 20,93 L20,15 Q20,8 27,8 Z"/>

              <path
                  android:strokeColor="#5B3A20"
                  android:strokeWidth="3"
                  android:pathData="M24,54 L84,54"/>

              <path android:fillColor="#000000"
                  android:pathData="M36,25 A6,6 0,1 0,48,25 A6,6 0,1 0,36,25"/>
              <path android:fillColor="#000000"
                  android:pathData="M60,25 A6,6 0,1 0,72,25 A6,6 0,1 0,60,25"/>
              <path android:fillColor="#000000"
                  android:pathData="M36,40 A6,6 0,1 0,48,40 A6,6 0,1 0,36,40"/>
              <path android:fillColor="#000000"
                  android:pathData="M60,40 A6,6 0,1 0,72,40 A6,6 0,1 0,60,40"/>

              <path android:fillColor="#000000"
                  android:pathData="M36,68 A6,6 0,1 0,48,68 A6,6 0,1 0,36,68"/>
              <path android:fillColor="#000000"
                  android:pathData="M60,68 A6,6 0,1 0,72,68 A6,6 0,1 0,60,68"/>
              <path android:fillColor="#000000"
                  android:pathData="M36,83 A6,6 0,1 0,48,83 A6,6 0,1 0,36,83"/>
              <path android:fillColor="#000000"
                  android:pathData="M60,83 A6,6 0,1 0,72,83 A6,6 0,1 0,60,83"/>
          </vector>
          EOF

      - name: Colocar icono en Manifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path("Domino6/app/src/main/AndroidManifest.xml")
          s=p.read_text()

          old='<application android:theme="@style/AppTheme"'
          new='<application android:icon="@drawable/ic_domino6" android:theme="@style/AppTheme"'

          if 'android:icon="@drawable/ic_domino6"' not in s:
              if old not in s:
                  raise SystemExit("No se encontró application")
              s=s.replace(old,new,1)

          p.write_text(s)
          print("Icono añadido al Manifest.")
          PY

      - name: Verificar código
        run: |
          sed -i 's/[[:space:]]*$//' Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "class DominoTile" Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "ic_domino6" Domino6/app/src/main/AndroidManifest.xml
          git diff --check
        
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar V5.2
        working-directory: Domino6
        run: gradle assembleDebug --stacktrace

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Domino6
          git diff --cached --quiet || git commit -m "V5.2 mesa fichas colores e icono"
          git push

      - name: Guardar APK V5.2
        uses: actions/upload-artifact@v4
        with:
          name: Domino6-V5.2-Mesa-Fichas-Icono
          path: Domino6/app/build/outputs/apk/debug/app-debug.apk