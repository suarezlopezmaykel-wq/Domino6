name: V5 Mesa Fichas Icono

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v5:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar V5
        working-directory: Domino6
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK V5
        uses: actions/upload-artifact@v4
        with:
          name: Domino6-V5-Mesa-Fichas
          path: Domino6/app/build/outputs/apk/debug/app-debug.apk