name: V6 paso 2 - Bluetooth puntuacion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v6:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar cambios V6 Bluetooth
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("Domino6/app/src/main/java/com/example/domino6/MainActivity.java")
          s = p.read_text()

          # ---------------------------------------------------------
          # 1. Reemplazar GameState completo
          # ---------------------------------------------------------
          start = s.index("    class GameState {")
          end = s.index("    class HostGameView", start)

          new_game = r'''    class GameState {
        int n;
        int turn=0;
        int left,right,passCount=0;
        boolean first=true,finished=false;
        int winner=-1;
        String result="";
        int starter=0;
        int opener=0;
        int[] score;
        ArrayList<ArrayList<Domino>> hands=new ArrayList<>();
        ArrayList<Domino> chain=new ArrayList<>();

        GameState(int n){
            this.n=n;
            score=new int[n];
            deal();
        }

        void deal(){
            ArrayList<Domino>d=new ArrayList<>();
            for(int a=0;a<=6;a++)
                for(int b=a;b<=6;b++)
                    d.add(new Domino(a,b));

            Collections.shuffle(d);

            hands.clear();
            for(int i=0;i<n;i++)
                hands.add(new ArrayList<>());

            for(int k=0;k<7;k++)
                for(int p=0;p<n;p++)
                    hands.get(p).add(d.remove(0));

            chain.clear();
            first=true;
            left=0;
            right=0;
            passCount=0;
            finished=false;
            winner=-1;
            result="";
            turn=starter;
            opener=starter;
        }

        void newHand(){
            deal();
        }

        boolean valid(Domino d){
            return first ||
                   d.a==left || d.b==left ||
                   d.a==right || d.b==right;
        }

        boolean playable(int p){
            for(Domino d:hands.get(p))
                if(valid(d)) return true;
            return false;
        }

        void place(Domino d){
            if(first){
                chain.add(d);
                left=d.a;
                right=d.b;
                first=false;
            }else if(d.a==left){
                chain.add(0,new Domino(d.b,d.a));
                left=d.b;
            }else if(d.b==left){
                chain.add(0,d);
                left=d.a;
            }else if(d.a==right){
                chain.add(d);
                right=d.b;
            }else if(d.b==right){
                chain.add(new Domino(d.b,d.a));
                right=d.a;
            }
        }

        void play(int p,int ix){
            Domino d=hands.get(p).remove(ix);
            place(d);
            passCount=0;

            if(hands.get(p).isEmpty()){
                finished=true;
                winner=p;
                score[p]+=2;
                starter=p;
                result="🏆 Gana Jugador "+(p+1)+" porque se quedó sin fichas.\n+1 punto";
                return;
            }

            turn=(turn+1)%n;
        }

        void pass(){
            passCount++;

            if(passCount>=n){
                finished=true;
                result=trancaText();
                return;
            }

            turn=(turn+1)%n;
        }

        int points(ArrayList<Domino> h){
            int x=0;
            for(Domino d:h)
                x+=d.a+d.b;
            return x;
        }

        String trancaText(){
            StringBuilder s=new StringBuilder("PARTIDA TRANCADA\n\n");

            int best=Integer.MAX_VALUE;
            ArrayList<Integer>winners=new ArrayList<>();

            for(int i=0;i<n;i++){
                int x=points(hands.get(i));

                s.append("Jugador ")
                 .append(i+1)
                 .append(": ")
                 .append(x)
                 .append(" puntos\n");

                if(x<best){
                    best=x;
                    winners.clear();
                    winners.add(i);
                }else if(x==best){
                    winners.add(i);
                }
            }

            s.append("\n");

            if(winners.size()==1){
                int w=winners.get(0);
                score[w]+=2;
                starter=w;

                s.append("🏆 Gana Jugador ")
                 .append(w+1)
                 .append(" con ")
                 .append(best)
                 .append(" puntos.\n+1 punto");
            }else{
                for(int w:winners)
                    score[w]++;

                boolean openerTied=false;

                for(int w:winners){
                    if(w==opener){
                        openerTied=true;
                        break;
                    }
                }

                if(openerTied){
                    starter=opener;
                }else{
                    starter=winners.get(
                        new Random().nextInt(winners.size())
                    );
                }

                s.append("⚖ Empate entre jugadores con ")
                 .append(best)
                 .append(" puntos.\n");

                s.append("Cada jugador empatado recibe +0.5 punto.\n");

                s.append("Jugador ")
                 .append(starter+1)
                 .append(" abrirá la próxima mano.");
            }

            return s.toString();
        }

        String stateFor(int p){
            StringBuilder h=new StringBuilder();

            for(int i=0;i<hands.get(p).size();i++){
                if(i>0) h.append(';');
                h.append(hands.get(p).get(i).a)
                 .append(',')
                 .append(hands.get(p).get(i).b);
            }

            StringBuilder c=new StringBuilder();

            for(int i=0;i<chain.size();i++){
                if(i>0) c.append(';');
                c.append(chain.get(i).a)
                 .append(',')
                 .append(chain.get(i).b);
            }

            StringBuilder sc=new StringBuilder();

            for(int i=0;i<n;i++){
                if(i>0) sc.append(';');
                sc.append(score[i]);
            }

            return "STATE|"+p+
                   "|"+turn+
                   "|"+(first?"1":"0")+
                   "|"+left+
                   "|"+right+
                   "|"+passCount+
                   "|"+(finished?"1":"0")+
                   "|"+winner+
                   "|"+result.replace("\n","~")+
                   "|"+starter+
                   "|"+sc+
                   "|"+h+
                   "|"+c;
        }
    }

'''

          s=s[:start]+new_game+s[end:]

          # ---------------------------------------------------------
          # 2. Host: permitir NUEVA MANO
          # ---------------------------------------------------------
          old='''void action(int player,String cmd){if(game==null||game.finished||game.turn!=player)return;if(cmd.startsWith("PLAY|")){int ix=parse(cmd.substring(5));if(ix>=0&&ix<game.hands.get(player).size()&&game.valid(game.hands.get(player).get(ix))){game.play(player,ix);broadcast();}}else if(cmd.equals("PASS")){if(!game.playable(player)){game.pass();broadcast();}}}'''

          new='''void action(int player,String cmd){
            if(game==null)return;

            if(cmd.equals("NEW_HAND")){
                if(game.finished){
                    game.newHand();
                    broadcast();
                }
                return;
            }

            if(game.finished || game.turn!=player)return;

            if(cmd.startsWith("PLAY|")){
                int ix=parse(cmd.substring(5));
                if(ix>=0 &&
                   ix<game.hands.get(player).size() &&
                   game.valid(game.hands.get(player).get(ix))){
                    game.play(player,ix);
                    broadcast();
                }
            }else if(cmd.equals("PASS")){
                if(!game.playable(player)){
                    game.pass();
                    broadcast();
                }
            }
        }'''

          if old not in s:
              raise SystemExit("No se encontró NetworkHost.action")

          s=s.replace(old,new,1)

          # ---------------------------------------------------------
          # 3. Host UI: botón Nueva mano
          # ---------------------------------------------------------
          old='''Button pass=btn("Pasar");
    addView(pass);
    pass.setOnClickListener(v->host.action(0,"PASS"));'''

          new='''if(host.game!=null && host.game.finished){
        Button nueva=btn("Nueva mano");
        addView(nueva);
        nueva.setOnClickListener(v->host.action(0,"NEW_HAND"));
    }else{
        Button pass=btn("Pasar");
        addView(pass);
        pass.setOnClickListener(v->host.action(0,"PASS"));
    }'''

          if old not in s:
              raise SystemExit("No se encontró botón Pasar del HostGameView")

          s=s.replace(old,new,1)

          # ---------------------------------------------------------
          # 4. Cliente: añadir puntuación
          # ---------------------------------------------------------
          old='''BluetoothDevice dev;BluetoothSocket socket;BufferedReader in;PrintWriter out;int me=-1,n=0;ArrayList<Domino> hand=new ArrayList<>(),chain=new ArrayList<>();int turn;boolean first;int left,right,passCount;boolean finished;int winner=-1;String result="";'''

          new='''BluetoothDevice dev;BluetoothSocket socket;BufferedReader in;PrintWriter out;int me=-1,n=0;ArrayList<Domino> hand=new ArrayList<>(),chain=new ArrayList<>();int turn;boolean first;int left,right,passCount;boolean finished;int winner=-1;String result="";int starter;int[] score=new int[4];'''

          if old not in s:
              raise SystemExit("No se encontró declaración NetworkClient")

          s=s.replace(old,new,1)

          # ---------------------------------------------------------
          # 5. Cliente: nuevo formato STATE
          # ---------------------------------------------------------
          old='''void decode(String s){String[]a=s.split("\\\\|",-1);turn=Integer.parseInt(a[2]);winner=Integer.parseInt(a[8]);result=a[9].replace("~","\\n");first="1".equals(a[3]);left=Integer.parseInt(a[4]);right=Integer.parseInt(a[5]);passCount=Integer.parseInt(a[6]);finished="1".equals(a[7]);hand=parseDominoList(a.length>10?a[10]:"");chain=parseDominoList(a.length>11?a[11]:"");}'''

          new='''void decode(String s){
            String[]a=s.split("\\\\|",-1);

            turn=Integer.parseInt(a[2]);
            winner=Integer.parseInt(a[8]);
            result=a[9].replace("~","\\n");

            starter=Integer.parseInt(a[10]);

            String[]ss=a[11].split(";");
            for(int i=0;i<score.length;i++)
                score[i]=0;

            for(int i=0;i<ss.length && i<score.length;i++){
                try{
                    score[i]=Integer.parseInt(ss[i]);
                }catch(Exception ignored){}
            }

            first="1".equals(a[3]);
            left=Integer.parseInt(a[4]);
            right=Integer.parseInt(a[5]);
            passCount=Integer.parseInt(a[6]);
            finished="1".equals(a[7]);

            hand=parseDominoList(a.length>12?a[12]:"");
            chain=parseDominoList(a.length>13?a[13]:"");
        }'''

          if old not in s:
              raise SystemExit("No se encontró decode")

          s=s.replace(old,new,1)

          # ---------------------------------------------------------
          # 6. Cliente: reemplazar drawClient completo
          # ---------------------------------------------------------
          start=s.index("        void drawClient(){", s.index("class NetworkClient"))
          end=s.index("\nvoid removeViewIfAny()",start)

          new_draw=r'''        void drawClient(){
    removeViewIfAny();

    LinearLayout l=base();

    l.addView(title("DOMINÓ 6 · Bluetooth"));

    l.addView(txt(
        "Eres Jugador "+(me+1)+" de "+n
    ));

    int myScore=(me>=0 && me<score.length)?score[me]:0;
    String puntos=(myScore/2)+(myScore%2==0?".0":".5");

    l.addView(txt("Tu puntuación: "+puntos));

    String estado;

    if(finished){
        estado=result;
    }else{
        estado=(turn==me)?
            "TU TURNO":
            "Turno del Jugador "+(turn+1);
    }

    TextView st=txt(estado);

    if(finished){
        st.setBackgroundColor(Color.rgb(120,35,35));
    }else{
        st.setBackgroundColor(Color.rgb(55,100,135));
    }

    l.addView(st);

    l.addView(txt("Mesa de juego"));

    HorizontalScrollView boardScroll=
        new HorizontalScrollView(MainActivity.this);

    LinearLayout boardBox=
        new LinearLayout(MainActivity.this);

    boardBox.setPadding(8,8,8,12);

    for(Domino d:chain){
        boardBox.addView(
            tile(d),
            new LinearLayout.LayoutParams(58,100)
        );
    }

    boardScroll.addView(boardBox);

    l.addView(boardScroll,
        new LinearLayout.LayoutParams(-1,110));

    l.addView(txt("Tus fichas:"));

    HorizontalScrollView handScroll=
        new HorizontalScrollView(MainActivity.this);

    LinearLayout hb=new LinearLayout(MainActivity.this);

    for(int i=0;i<hand.size();i++){
        final int ix=i;

        addTile(hb,hand.get(i),v->{
            if(turn==me && !finished)
                send("PLAY|"+ix);
        });
    }

    handScroll.addView(hb);

    l.addView(handScroll,
        new LinearLayout.LayoutParams(-1,130));

    if(finished){
        Button nueva=btn("Nueva mano");
        l.addView(nueva);

        nueva.setOnClickListener(v->
            send("NEW_HAND")
        );
    }else{
        Button pass=btn("Pasar");
        l.addView(pass);

        pass.setOnClickListener(v->{
            if(turn==me && !finished)
                send("PASS");
        });
    }

    Button menu=btn("Menú");
    l.addView(menu);

    menu.setOnClickListener(v->{
        try{socket.close();}catch(Exception ignored){}
        showMenu();
    });

    setContentView(l);
}

'''

          s=s[:start]+new_draw+s[end+1:]

          p.write_text(s)
          print("V6 paso 2 aplicado correctamente.")
          PY

      - name: Verificar código
        run: |
          git diff --check
          grep -n "int\[\] score" Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "NEW_HAND" Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          grep -n "starter" Domino6/app/src/main/java/com/example/domino6/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK V6 paso 2
        working-directory: Domino6
        run: gradle assembleDebug --stacktrace

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Domino6/app/src/main/java/com/example/domino6/MainActivity.java
          git commit -m "V6 paso 2 Bluetooth puntuacion y nueva mano" || true
          git push

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Domino6-V6-paso2-Bluetooth
          path: Domino6/app/build/outputs/apk/debug/app-debug.apk